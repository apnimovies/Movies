<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Movie Download</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>MovieHub</h1>
        <p>Free movie download collection</p>
      </div>
    </div>
    <input id="searchInput" type="search" placeholder="Search movie..." />
  </header>

  <main class="container">
    <section class="section-head">
      <h2>Movies</h2>
      <p>Poster par click karo, quality select karo aur download karo.</p>
    </section>

    <section id="movieGrid" class="movie-grid"></section>
    <div id="emptyState" class="empty-state" style="display:none;">No movies found.</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
