<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Movie Download</title>
  <link rel="stylesheet" href="style.css?v=20260720-1" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>MovieHub</h1>
        <p>Free movie download collection</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="notificationEnableBtn" class="notification-btn" type="button">Enable Notifications</button>
      <input id="searchInput" type="search" placeholder="Search movie..." />
    </div>
  </header>

  <div id="notificationStatus" class="notification-status" aria-live="polite"></div>

  <main class="container">
    <section class="section-head">
      <h2>Movies</h2>
      <p>Poster par click karo, quality select karo aur download karo.</p>
    </section>

    <section id="movieGrid" class="movie-grid"></section>
    <div id="emptyState" class="empty-state" style="display:none;">No movies found.</div>
  </main>

  <script src="push-config.js?v=20261031-1"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="push.js?v=20261031-1" defer></script>
  <script src="script.js?v=20260720-1"></script>
</body>
</html>
